services:
  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: admin-panel-api
      CORS_ORIGINS: http://localhost:3000
      PUBLIC_BASE_URL: http://localhost:8000
      ADMIN_SERVICE_URL: ${ADMIN_SERVICE_URL:-}
      ONLINE_TRADING_SERVICE_URL: ${ONLINE_TRADING_SERVICE_URL:-}
      NETFLOW_SERVICE_URL: ${NETFLOW_SERVICE_URL:-}
      FILE_SERVICE_URL: ${FILE_SERVICE_URL:-}
      MARKETER_SERVICE_URL: ${MARKETER_SERVICE_URL:-}
      SEJAM_SERVICE_URL: ${SEJAM_SERVICE_URL:-}
    ports:
      - "8000:8000"

  web:
    build:
      context: .
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_IDP_URL: http://localhost:8000/idp
      NEXT_PUBLIC_ADMIN_GATEWAY_URL: http://localhost:8000/proxy/admin
      NEXT_PUBLIC_ONLINE_TRADING_URL: http://localhost:8000/proxy/online-trading
      NEXT_PUBLIC_NETFLOW_URL: http://localhost:8000/proxy/netflow
      NEXT_PUBLIC_FILE_SERVER_URL: http://localhost:8000/proxy/files
      NEXT_PUBLIC_MARKETER_ADMIN_URL: http://localhost:8000/proxy/marketer
      NEXT_PUBLIC_SEJAM_GATEWAY_URL: http://localhost:8000/proxy/sejam
    ports:
      - "3000:3000"
    depends_on:
      - backend
